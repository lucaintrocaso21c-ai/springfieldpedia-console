name: Console - avvisi giornalieri
on:
  schedule:
    - cron: '0 7 * * *'   # 08:00 in Italia in inverno (09:00 in estate)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: console
  cancel-in-progress: false
jobs:
  avvisi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Manda gli avvisi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALLOWED_USER_ID: ${{ secrets.ALLOWED_USER_ID }}
        run: python bot.py avvisi
      - name: Salva i dati
        run: |
          git config user.name "console-bot"
          git config user.email "console-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "avvisi inviati" && git pull --rebase -q && git push -q)
