name: YouTube upload
on:
  workflow_dispatch:
    inputs:
      nota:
        description: opzionale
        default: ''
      max:
        description: max upload per run (quota 6/giorno)
        default: '6'
permissions:
  contents: write
concurrency: yt-upload
jobs:
  up:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Scarica file (branch media)
        run: |
          git fetch origin media --depth=1
          git checkout FETCH_HEAD -- dl
          for f in dl/*.part00; do base="${f%.part00}"; cat "$base".part* > "$base"; rm "$base".part*; done
          ls -la dl
      - name: Carica su YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_UPLOADS: ${{ inputs.max }}
        run: python3 tools/yt_upload.py
      - name: Salva stato
        if: always()
        run: |
          git config user.name "console-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/yt_done.json || true
          git commit -m "yt: stato upload" || true
          git pull --rebase || true
          git push || true
