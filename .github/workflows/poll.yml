name: Console - risposte ai comandi
on:
  schedule:
    - cron: '*/10 * * * *'   # ogni 10 minuti. Se il repository e PRIVATO cambia in '*/30 7-22 * * *' per restare nei minuti gratuiti
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: console
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gestisci i comandi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALLOWED_USER_ID: ${{ secrets.ALLOWED_USER_ID }}
        run: python bot.py poll
      - name: Salva i dati
        run: |
          git config user.name "console-bot"
          git config user.email "console-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "dati aggiornati" && git pull --rebase -q && git push -q)
