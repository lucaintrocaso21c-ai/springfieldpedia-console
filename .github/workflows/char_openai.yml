name: Ritagli personaggi
on:
  workflow_dispatch:
    inputs:
      cartella:
        description: nomi (vuoto = tutti)
        default: ""
permissions:
  contents: write
concurrency: char-openai
jobs:
  cov:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install openai pillow
      - name: Genera
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHAR_NAMES: ${{ inputs.cartella }}
        run: python3 tools/char_openai.py $CHAR_NAMES
      - name: Salva
        if: always()
        run: |
          git config user.name "console-bot"; git config user.email "bot@users.noreply.github.com"
          git add covers/char || true
          git commit -m "copertine OpenAI: ${{ inputs.cartella }}" || true
          git pull --rebase -q origin HEAD || true
          git push -q origin HEAD || true
